<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการคลังข้อสอบอัจฉริยะ (Exam Manager)</title>
    <!-- ใช้ Tailwind CSS เพื่อความสวยงามและใช้งานง่าย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-8">
        <h1 class="text-2xl font-bold text-indigo-600 mb-2">📚 ระบบจัดการคลังข้อสอบออนไลน์</h1>
        <p class="text-gray-500 mb-6">เชื่อมต่อกับ Google Apps Script เพื่อบันทึกและดึงข้อมูลข้อสอบ</p>

        <!-- ส่วนควบคุมปุ่มกด -->
        <div class="flex flex-wrap gap-4 mb-8">
            <button onclick="uploadSampleExam()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl shadow transition duration-200 flex items-center gap-2">
                📤 อัปโหลดชุดข้อสอบตัวอย่าง
            </button>
            <button onclick="loadExams()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2.5 rounded-xl shadow transition duration-200 flex items-center gap-2">
                📥 โหลดรายการข้อสอบทั้งหมด
            </button>
        </div>

        <!-- กล่องแสดงสถานะการทำงาน -->
        <div id="statusMessage" class="hidden p-4 mb-6 rounded-xl text-sm"></div>

        <!-- ส่วนแสดงผลตารางข้อมูลข้อสอบ -->
        <h2 class="text-lg font-semibold text-gray-700 mb-3">📋 รายการข้อสอบในระบบ</h2>
        <div class="overflow-x-auto border border-gray-200 rounded-xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider">
                        <th class="p-3 border-b">ID</th>
                        <th class="p-3 border-b">วิชา / ระดับชั้น</th>
                        <th class="p-3 border-b">คำถาม</th>
                        <th class="p-3 border-b">ระดับความยาก</th>
                        <th class="p-3 border-b">แท็ก</th>
                    </tr>
                </thead>
                <tbody id="examTableBody" class="divide-y divide-gray-200 text-sm">
                    <tr>
                        <td colspan="5" class="p-6 text-center text-gray-400">ยังไม่มีข้อมูล กดปุ่ม "โหลดรายการข้อสอบทั้งหมด" เพื่อแสดงข้อมูล</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // URL ของ Google Apps Script Web App ที่คุณ Deploy ไว้
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzZ5uzEqNXZNwGS5j12GtVYqx_i50aiFs-sLHBO1vo_jZU4T-xJIv5wAo5VMOw-LQIe/exec";

        // แสดงข้อความแจ้งเตือนสถานะ
        function showStatus(message, type = 'success') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = `p-4 mb-6 rounded-xl text-sm ${type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`;
            statusDiv.textContent = message;
            statusDiv.classList.remove('hidden');
        }

        // ตัวอย่างข้อมูลข้อสอบที่จะส่งไปบันทึก
        const sampleExamData = {
            "subject": "ภาษาไทย",
            "grade": "ม.3",
            "objective": "ทดสอบความรู้ภาษาไทยพื้นฐาน",
            "totalQuestions": 1,
            "questions": [
                {
                    "id": "Q-WEB-01",
                    "question": "ข้อใดมีคำสมาสเกิดขึ้น (จากเว็บ)",
                    "options": ["ราชสำนัก", "ผลไม้", "ชาวนา", "คุณธรรม"],
                    "correctIndex": 0,
                    "explanation": "ราชสำนัก มาจากภาษาบาลีสันสกฤตสมาสกัน",
                    "difficulty": "easy",
                    "hint": "สังเกตคำบาลี-สันสกฤต",
                    "points": 100,
                    "topicTag": "คำสมาส-คำสนธิ"
                }
            ]
        };

        // ฟังก์ชันอัปโหลดข้อสอบ
        async function uploadSampleExam() {
            showStatus("กำลังส่งข้อมูลไปยัง Google Sheets...", "success");
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors", // ใช้ no-cors เพื่อป้องกันปัญหา CORS error เบื้องต้นบน Client-side
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(sampleExamData)
                });
                
                showStatus("✅ ส่งชุดข้อสอบตัวอย่างสำเร็จ! (ลองกดโหลดรายการข้อสอบเพื่อตรวจสอบ)", "success");
                setTimeout(loadExams, 1500); // โหลดข้อมูลใหม่หลังผ่านไป 1.5 วิ
            } catch (error) {
                showStatus("❌ เกิดข้อผิดพลาด: " + error.toString(), "error");
            }
        }

        // ฟังก์ชันดึงข้อมูลข้อสอบทั้งหมดมาแสดง
        async function loadExams() {
            showStatus("กำลังดึงข้อมูลจาก Google Sheets...", "success");
            const tbody = document.getElementById('examTableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">กำลังโหลดข้อมูล...</td></tr>`;

            try {
                const response = await fetch(WEB_APP_URL);
                const result = await response.json();

                if (result.status === "success" && result.data.length > 0) {
                    tbody.innerHTML = "";
                    result.data.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition";
                        tr.innerHTML = `
                            <td class="p-3 font-semibold text-indigo-600">${item.id || '-'}</td>
                            <td class="p-3">${item.subject || '-'} (${item.grade || '-'})</td>
                            <td class="p-3">${item.question || '-'}</td>
                            <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${item.difficulty === 'hard' ? 'bg-rose-100 text-rose-700' : item.difficulty === 'medium' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${item.difficulty || 'medium'}</span></td>
                            <td class="p-3 text-gray-500">${item.topicTag || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                    showStatus(`✅ โหลดข้อมูลสำเร็จ ทั้งหมด ${result.data.length} ข้อ`, "success");
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">ไม่พบข้อมูลในระบบ หรือชีตยังว่างอยู่</td></tr>`;
                    showStatus("⚠️ ไม่พบข้อมูลข้อสอบใน Google Sheets", "error");
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-rose-400">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
                showStatus("❌ ไม่สามารถเชื่อมต่อกับ Web App ได้: " + error.toString(), "error");
            }
        }
    </script>
</body>
</html>
